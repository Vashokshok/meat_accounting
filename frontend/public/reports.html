<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Учёт мяса — Отчёты</title>

    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
    <link rel="apple-touch-icon" href="/static/icon-192.png">

    <link
        rel="stylesheet"
        href="/static/css/reports.css?v=day-month-excel"
    >

    <script
        src="/static/js/reports.js?v=day-month-excel"
        defer
    ></script>
</head>

<body>

<div class="reports-page">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="reports-header">

        <div class="header-left">

            <button
                class="back-button"
                id="back-button"
                type="button"
                aria-label="Назад"
            >
                ←
            </button>

            <div>
                <h1>Отчёты</h1>

                <p id="report-date">
                    За месяц
                </p>
            </div>

        </div>

    </header>


    <!-- =========================
         CONTENT
    ========================== -->

    <main class="reports-content">

        <!-- ERROR -->

        <div
            class="report-error"
            id="report-error"
            hidden
        >
            <div class="error-title">
                Не удалось загрузить отчёт
            </div>

            <div
                class="error-message"
                id="error-message"
            >
                Попробуйте ещё раз.
            </div>

            <button
                class="retry-button"
                id="retry-button"
                type="button"
            >
                Повторить
            </button>
        </div>


        <!-- REPORT -->

        <section
            class="report-card"
            id="report-card"
        >

            <div class="report-title-row">
                <div>
                    <h2>Движение мяса</h2>
                    <p>Остатки и операции за выбранный период</p>
                </div>
                <div class="report-filters">
                    <label class="period-picker" for="report-period">
                        <span>Период</span>
                        <select id="report-period">
                            <option value="month">Месяц</option>
                            <option value="day">День</option>
                        </select>
                    </label>
                    <label class="date-picker" id="month-picker" for="report-month">
                        <span>Месяц</span>
                        <input id="report-month" type="month">
                    </label>
                    <label class="date-picker" id="day-picker" for="report-day" hidden>
                        <span>День</span>
                        <input id="report-day" type="date">
                    </label>
                </div>
            </div>

            <div class="report-table-container">
                <table class="report-table">
                    <thead>
                        <tr>
                            <th>Мясо</th>
                            <th>На начало</th>
                            <th>Приход</th>
                            <th>Вертель</th>
                            <th>Списание</th>
                            <th>Конвектомат</th>
                            <th>Франшиза</th>
                            <th>На конец</th>
                        </tr>
                    </thead>
                    <tbody id="report-rows"></tbody>
                </table>
            </div>

        </section>


        <!-- =========================
             EXCEL
        ========================== -->

        <button
            class="excel-button"
            id="excel-button"
            type="button"
        >
            <span class="excel-icon">↓</span>

            <span>
                Скачать Excel
            </span>
        </button>


        <!-- =========================
             INFO
        ========================== -->

        <div
            class="last-update"
            id="last-update"
        >
            Обновление данных...
        </div>

    </main>


    <!-- =========================
         BOTTOM NAVIGATION
    ========================== -->

    <nav class="bottom-navigation">

        <a
            href="/dashboard"
            class="nav-item"
        >
            <span class="nav-icon">⌂</span>

            <span>
                Главная
            </span>
        </a>


        <a
            href="/history"
            class="nav-item"
        >
            <span class="nav-icon">≡</span>

            <span>
                История
            </span>
        </a>


        <a
            href="/reports"
            class="nav-item active"
        >
            <span class="nav-icon">▥</span>

            <span>
                Отчёты
            </span>

            <span class="active-dot"></span>
        </a>

    </nav>


    <!-- =========================
         TOAST
    ========================== -->

    <div
        class="toast"
        id="toast"
        role="status"
    ></div>

</div>

</body>
</html>
