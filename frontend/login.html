<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Учёт мяса — Вход</title>

    <link
        rel="stylesheet"
        href="/static/css/login.css"
    >
</head>

<body>

<main class="login-page">

    <section class="login-card">

        <div class="logo">
            М
        </div>

        <h1>Учёт мяса</h1>

        <p class="subtitle">
            Внутренняя система точки
        </p>

        <form
            id="login-form"
            class="login-form"
        >

            <div class="field">

                <label for="username">
                    Логин
                </label>

                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    placeholder="Введите логин"
                    maxlength="50"
                    required
                >

            </div>

            <div class="field">

                <label for="password">
                    Пароль
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Введите пароль"
                    maxlength="100"
                    required
                >

            </div>

            <div
                id="login-error"
                class="login-error"
                role="alert"
                aria-live="polite"
            ></div>

            <button
                id="login-button"
                class="login-button"
                type="submit"
            >
                <span id="login-button-text">
                    Войти
                </span>

                <span
                    id="login-spinner"
                    class="spinner"
                ></span>
            </button>

        </form>

        <p class="users-hint">
            admin / user1 / user2
        </p>

    </section>

</main>

<script src="/static/js/login.js"></script>

</body>
</html>
