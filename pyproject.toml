[project]
name = "meat-accounting"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
exclude = ["migrations", "__pycache__", ".venv", "venv"]

[tool.ruff.lint]
# B008 — идиома FastAPI: Depends(...) в аргументах по умолчанию
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
